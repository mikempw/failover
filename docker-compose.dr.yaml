name: ast-dr

x-failover-env: &failover-env
  - path: ./failover/.env.dr.example
    required: true
  - path: ./.env.dr
    required: false
  - path: ./failover/.env.dr
    required: false

x-otel-env: &otel-env
  - path: ./.env.example
    required: true
  - path: ./.env
    required: false
  - path: ./failover/.env.dr.example
    required: true
  - path: ./.env.dr
    required: false
  - path: ./failover/.env.dr
    required: false

volumes:
  victoriametrics:
  clickhouse:
  grafana:
  dr_failover_state:
  dr_vm_sync_state:
  dr_ch_sync_state:

networks:
  ast_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${AST_NETWORK_SUBNET:-172.30.0.0/24}

secrets:
  clickhouse_password:
    file: ${CLICKHOUSE_PASSWORD_FILE:-./secrets/clickhouse_password.txt}
  grafana_clickhouse_password:
    file: ${GRAFANA_CLICKHOUSE_PASSWORD_FILE:-./secrets/grafana_clickhouse_password.txt}
  primary_clickhouse_password:
    file: ${PRIMARY_CLICKHOUSE_PASSWORD_FILE:-./secrets/primary_clickhouse_password.txt}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets/grafana_admin_password.txt}

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.93.0
    container_name: victoriametrics
    restart: unless-stopped
    stop_grace_period: 5m
    volumes:
      - victoriametrics:/victoria-metrics-data
    command:
      - --storageDataPath=/victoria-metrics-data
      - --retentionPeriod=12
      - --httpListenAddr=:8428
      - --dedup.minScrapeInterval=30s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8428:8428"
    networks:
      - ast_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:24.3.18.7
    container_name: clickhouse
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/usr/local/bin/secure-clickhouse-entrypoint.sh"]
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./services/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ./services/clickhouse/users.xml:/etc/clickhouse-server/users.d/custom.xml:ro
      - ./services/clickhouse/secure-entrypoint.sh:/usr/local/bin/secure-clickhouse-entrypoint.sh:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8123:8123"
      - "${BIND_ADDRESS:-127.0.0.1}:9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-ast}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ast}
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_INTERNAL_CIDR: ${AST_NETWORK_SUBNET:-172.30.0.0/24}
      CLICKHOUSE_REMOTE_CIDRS: ${CLICKHOUSE_REMOTE_CIDRS:-}
      GRAFANA_CLICKHOUSE_USER: ${GRAFANA_CLICKHOUSE_USER-grafana}
      GRAFANA_CLICKHOUSE_PASSWORD_FILE: /run/secrets/grafana_clickhouse_password
    secrets:
      - clickhouse_password
      - grafana_clickhouse_password
    networks:
      - ast_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  otel-collector:
    build:
      context: .
      dockerfile: services/otel_collector/Dockerfile
    image: ast-otel-collector
    container_name: application-study-tool-otel-collector-1
    restart: "no"
    volumes:
      - ./services/otel_collector:/etc/otel-collector-config:ro
      - ${OTEL_RECEIVERS_FILE:-./services/otel_collector/receivers.example.yaml}:/run/source-otel-config/receivers.yaml:ro
      - ${OTEL_SECRETS_DIR:-./services/otel_collector/example-secrets}:/run/source-otel-secrets:ro
      - dr_failover_state:/state:ro
    command:
      - --config=/etc/otel-collector-config/defaults/bigip-scraper-config.yaml
    env_file: *otel-env
    environment:
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ast}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-ast}
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      LOCAL_VM_WRITE_URL: http://victoriametrics:8428/api/v1/write
      PEER_VM_WRITE_URL: ${PRIMARY_VM_WRITE_URL:-http://192.0.2.10:8428/api/v1/write}
    secrets:
      - clickhouse_password
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8888:8888"
      - "${BIND_ADDRESS:-127.0.0.1}:4317:4317"
      - "${BIND_ADDRESS:-127.0.0.1}:4318:4318"
    networks:
      - ast_network
    depends_on:
      victoriametrics:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "--spider", "http://127.0.0.1:8888/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    build:
      context: .
      dockerfile: services/grafana/Dockerfile
    image: ast-grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-ast-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      CLICKHOUSE_USER: ${GRAFANA_CLICKHOUSE_USER-grafana}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-ast}
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/grafana_clickhouse_password
    secrets:
      - grafana_clickhouse_password
      - grafana_admin_password
    networks:
      - ast_network
    depends_on:
      victoriametrics:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  dns-failover:
    build:
      context: .
      dockerfile: failover/Dockerfile
    image: dns-failover
    container_name: dns-failover
    restart: unless-stopped
    env_file: *failover-env
    volumes:
      - dr_failover_state:/state
      - ${FAILOVER_SECRETS_DIR:-./secrets/failover}:/run/source-secrets:ro
      - ./scripts:/run/source-scripts:ro
    networks:
      - ast_network
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/readyz' % os.getenv('STATUS_PORT', '8080'), timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  otel-watcher:
    build:
      context: .
      dockerfile: failover/Dockerfile.otel-watcher-docker
    image: otel-watcher
    container_name: otel-watcher
    restart: unless-stopped
    network_mode: host
    env_file: *failover-env
    environment:
      OTEL_CONTAINER: application-study-tool-otel-collector-1
      OTEL_CHECK_INTERVAL: ${OTEL_CHECK_INTERVAL:-15}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dr_failover_state:/state:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/readyz' % os.getenv('STATUS_PORT', '8080'), timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  vm-sync:
    build:
      context: .
      dockerfile: vm-sync/Dockerfile
    image: vm-sync
    container_name: vm-sync
    restart: unless-stopped
    environment:
      SOURCE_URL: ${PRIMARY_VM_URL:-http://192.0.2.10:8428}
      DEST_URL: http://victoriametrics:8428
      SYNC_INTERVAL: ${VM_SYNC_INTERVAL:-300}
      SYNC_LOOKBACK: ${VM_SYNC_LOOKBACK:-30}
      SYNC_START_TIMESTAMP: ${VM_SYNC_START_TIMESTAMP:-}
      HEALTH_PORT: "8080"
    volumes:
      - dr_vm_sync_state:/state
    networks:
      - ast_network
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/readyz' % os.getenv('HEALTH_PORT', '8080'), timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  ch-sync:
    build:
      context: .
      dockerfile: ch-sync/Dockerfile
    image: ch-sync
    container_name: ch-sync
    restart: unless-stopped
    env_file: *failover-env
    environment:
      SOURCE_SCHEME: ${PRIMARY_CLICKHOUSE_SCHEME:-http}
      SOURCE_HOST: ${PRIMARY_CLICKHOUSE_HOST:-192.0.2.10}
      SOURCE_PORT: ${PRIMARY_CLICKHOUSE_HTTP_PORT:-8123}
      SOURCE_USER: ${PRIMARY_CLICKHOUSE_USER:-ast}
      SOURCE_PASSWORD_FILE: /run/secrets/primary_clickhouse_password
      DEST_SCHEME: http
      DEST_HOST: clickhouse
      DEST_PORT: "8123"
      DEST_USER: ${CLICKHOUSE_USER:-ast}
      DEST_PASSWORD_FILE: /run/secrets/clickhouse_password
      SYNC_INTERVAL: ${CH_SYNC_INTERVAL:-300}
      SYNC_DATABASES: ${CH_SYNC_DATABASES:-ast}
      SYNC_GUARD_LEASE_PROOF_FILE: /failover-state/observed-lease.json
      HEALTH_PORT: "8080"
    volumes:
      - dr_ch_sync_state:/state
      - dr_failover_state:/failover-state:ro
    secrets:
      - clickhouse_password
      - primary_clickhouse_password
    networks:
      - ast_network
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/readyz' % os.getenv('HEALTH_PORT', '8080'), timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

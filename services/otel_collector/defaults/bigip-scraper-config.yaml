# bigip-scraper-config.yaml
#
# OTEL Collector config for dual-site metrics delivery
# Pushes metrics to BOTH the local and the peer site's VictoriaMetrics.
# Same file at both sites; the peer is set per site via PEER_VM_URL
# (docker-compose.<site>.yaml), so whichever site is active writes to both.
#
# Place in: services/otel_collector/defaults/bigip-scraper-config.yaml

receivers: ${file:/etc/otel-collector-config/receivers.yaml}

processors:
  batch/local:
    timeout: 10s
    send_batch_size: 10000
    
  batch/f5-datafabric:
    send_batch_max_size: 8192
    
  interval/f5-datafabric:
    interval: 300s
    
  attributes/f5-datafabric:
    actions:
      - key: dataType
        action: upsert
        value: bigip-ast-metric

exporters:
  # ===================
  # Local VictoriaMetrics (this site)
  # ===================
  prometheusremotewrite/local:
    endpoint: http://victoriametrics:8428/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # ===================
  # Peer VictoriaMetrics (the other site)
  # ===================
  prometheusremotewrite/peer:
    endpoint: ${env:PEER_VM_URL}
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

  # ===================
  # ClickHouse (local only - synced via ch-sync)
  # ===================
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: ast
    ttl: 72h
    create_schema: true
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # ===================
  # F5 Datafabric (optional)
  # ===================
  otlp/f5-datafabric:
    endpoint: us.edge.df.f5.com:443
    headers:
      Authorization: "kovacs ${env:SENSOR_ID} ${env:SENSOR_SECRET_TOKEN}"
      X-F5-OTEL: "GRPC"
    tls:
      insecure: false
      ca_file: /etc/ssl/certs/ca-certificates.pem

  # ===================
  # Debug
  # ===================
  debug/bigip:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  pipelines: ${file:/etc/otel-collector-config/pipelines.yaml}

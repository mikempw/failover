receivers: ${file:/run/runtime-config/receivers.yaml}

processors:
  batch/local:
    timeout: 10s
    send_batch_size: 10000

  batch/f5-datafabric:
    send_batch_max_size: 8192

  interval/f5-datafabric:
    interval: 300s

  attributes/f5-datafabric:
    actions:
      - key: dataType
        action: upsert
        value: bigip-ast-metric

exporters:
  prometheusremotewrite/local:
    endpoint: ${env:LOCAL_VM_WRITE_URL}
    resource_to_telemetry_conversion:
      enabled: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  prometheusremotewrite/peer:
    endpoint: ${env:PEER_VM_WRITE_URL}
    resource_to_telemetry_conversion:
      enabled: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    remote_write_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

  clickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    username: ${env:CLICKHOUSE_USER}
    password: ${file:/run/runtime-secrets/clickhouse_password}
    database: ${env:CLICKHOUSE_DATABASE}
    ttl: 72h
    create_schema: true
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_table_name: otel_metrics
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  otlp/f5-datafabric:
    endpoint: us.edge.df.f5.com:443
    headers:
      Authorization: ${file:/run/runtime-secrets/datafabric_authorization}
      X-F5-OTEL: GRPC
    tls:
      insecure: false
      ca_file: /etc/ssl/certs/ca-certificates.pem

  debug/bigip:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines: ${file:/etc/otel-collector-config/pipelines.yaml}

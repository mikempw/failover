metrics:
  receivers:
    - bigip
  processors:
    - batch/local
  exporters:
    - prometheusremotewrite/local
    - prometheusremotewrite/peer
    - clickhouse

metrics/f5-datafabric:
  receivers:
    - bigip
  processors:
    - batch/f5-datafabric
    - interval/f5-datafabric
    - attributes/f5-datafabric
  exporters:
    - otlp/f5-datafabric

# The BIG-IP scraper is metrics-only. The included OTLP receiver preserves
# local ClickHouse ingestion for applications sending logs or traces to 4317
# or 4318 without creating invalid BIG-IP signal pipelines.
logs:
  receivers:
    - otlp
  processors:
    - batch/local
  exporters:
    - clickhouse

traces:
  receivers:
    - otlp
  processors:
    - batch/local
  exporters:
    - clickhouse
